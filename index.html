<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חומר תורשתי, מחזור התא ומ-DNA לחלבון – פעילות אינטראקטיבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f8;--card:#fff;--ink:#14232e;--mut:#51636f;--line:#d3dde3;--dna:#2563c9;--rna:#c4600e;--pro:#16805a;--chr:#7c4dc4;--chr2:#b79be3;--bad:#b42a40;--ok:#16805a;--acc:#14232e;--accT:#fff;--nuc:#e8f0fb}
:root[data-theme=dark]{--bg:#0f1a21;--card:#17252e;--ink:#e6eef2;--mut:#9bb0bb;--line:#2a3d48;--dna:#6aa0ff;--rna:#f0a15a;--pro:#4cc790;--chr:#a98af0;--chr2:#6b52a8;--bad:#ff7a8c;--ok:#4cc790;--acc:#e6eef2;--accT:#0f1a21;--nuc:#1c3140}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Assistant,Arial,sans-serif}
h1,h2,h3{font-family:Rubik,Assistant,Arial,sans-serif;line-height:1.3;margin:.2em 0 .5em}
h1{font-size:1.25rem;margin:0}h2{font-size:1.6rem}h3{font-size:1.15rem}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:.6rem 1rem}
.top{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.score{font-weight:600;color:var(--pro)}
nav{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .1rem}
.st{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.25rem .8rem;font:inherit;font-size:.9rem;cursor:pointer}
.st.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.st.seen:not(.on){border-color:var(--pro)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:.4rem}.bar i{display:block;height:100%;background:var(--pro);border-radius:4px;transition:width .3s}
main{max-width:920px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}
.term{border-inline-start:6px solid var(--c);background:var(--bg);border-radius:8px;padding:.5rem .8rem}
.term b{color:var(--c);font-family:Rubik,sans-serif}
.t-dna{--c:var(--dna)}.t-rna{--c:var(--rna)}.t-pro{--c:var(--pro)}.t-chr{--c:var(--chr)}
.dna{color:var(--dna)}.rna{color:var(--rna)}.pro{color:var(--pro)}.chr{color:var(--chr)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--acc);color:var(--accT);border:0;border-radius:9px;padding:.4rem 1rem;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--chr);outline-offset:2px}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.5rem 0}
input[type=range]{flex:1;min-width:160px;accent-color:var(--chr)}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem}
textarea{width:100%;min-height:70px}
svg{width:100%;height:auto;display:block;background:var(--card);border-radius:10px}
svg text{fill:var(--ink);font-family:Assistant,Arial,sans-serif;font-size:14px}
.nuc{fill:var(--nuc);stroke:var(--dna);stroke-width:2}.cellc{fill:var(--nuc);stroke:var(--mut);stroke-width:2}
.opt{display:block;width:100%;text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:.45rem .8rem;margin:.3rem 0;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.fb{margin:.3rem 0 .8rem;font-size:.95rem}.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}.fb .btn{margin-inline-start:.5rem;padding:.1rem .7rem}
.qq{border-bottom:1px dashed var(--line);padding-bottom:.4rem}
.seq{direction:ltr;display:flex;flex-wrap:wrap;gap:4px;font-family:monospace;font-weight:700;margin:.4rem 0}
.seq span{min-width:2.4ch;text-align:center;border-radius:6px;padding:.1rem .3rem;border:2px solid transparent}
.cod{border-color:var(--rna)!important;color:var(--rna)}.aa{border-color:var(--pro)!important;color:var(--pro)}.cur{background:var(--chr2)}
table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{border:1px solid var(--line);padding:.35rem .6rem;text-align:center}th{background:var(--bg)}
.ok{color:var(--ok)}.no{color:var(--bad)}
.pick{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:.2rem .7rem;margin:.2rem;background:var(--bg);cursor:pointer}
.foot{display:flex;justify-content:space-between;margin:1rem 0 3rem}
.sample{display:none;background:var(--bg);border-inline-start:5px solid var(--pro);padding:.5rem .8rem;margin:.4rem 0;border-radius:6px}.sample.show{display:block}
@media(max-width:600px){body{font-size:16px}h2{font-size:1.35rem}.card{padding:.8rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header>
 <div class="top"><h1>גנטיקה ותא – מסע מ-DNA לחלבון</h1>
 <div class="row" style="margin:0"><span class="score">נקודות: <span id="score">0</span></span>
 <button class="btn alt" id="dark" aria-label="מצב כהה">מצב כהה</button><button class="btn alt" id="reset">איפוס</button></div></div>
 <nav id="nav" aria-label="שלבי הפעילות"></nav><div class="bar"><i id="prog"></i></div>
</header>
<main id="main"></main>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var KEY="bio-heredity-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
var S=load();S.step=S.step||0;S.ok=S.ok||{};S.att=S.att||{};S.seen=S.seen||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function award(k){if(!S.ok[k]&&!S.att[k]){S.ok[k]=1;save();upd()}else{S.att[k]=1;save()}}
function upd(){$("#score").textContent=Object.keys(S.ok).length}

/* ---------- חידונים ---------- */
var Q={
open:[{q:"איזה מושג מתאר קטע DNA המקודד לתוצר (חלבון או RNA)?",o:["גן","קודון","כרומטידה","ריבוזום"],c:0,e:"גן הוא קטע DNA המקודד לתוצר. קודון הוא שלישייה ב-mRNA, וכרומטידה היא עותק של כרומוזום."},
{q:"איזה תהליך יוצר mRNA על בסיס גן?",o:["שעתוק","תרגום","שכפול","מיטוזה"],c:0,e:"שעתוק: סינתזת RNA לפי גדיל התבנית של ה-DNA. תרגום הוא יצירת החלבון לפי ה-mRNA."},
{q:"היכן נמצא רוב החומר התורשתי בתא אאוקריוטי?",o:["בגרעין, בכרומוזומים","בריבוזומים","בקרום התא","בציטופלזמה בלבד"],c:0,e:"ה-DNA מאורגן בכרומוזומים בגרעין (מעט DNA נמצא גם במיטוכונדריה ובכלורופלסטים)."}],
gen:[{q:"בדגימת DNA דו-גדילי 20% מהבסיסים הם G. מהו אחוז ה-A?",o:["20%","30%","40%","60%"],c:1,e:"G=C=20%, לכן יחד 40%. נשארו 60% ל-A ול-T, ומכיוון ש-A=T כל אחד 30%."},
{q:"מה מבטיח ששתי מולקולות ה-DNA החדשות זהות לאם?",o:["זיווג בסיסים משלים, וכל גדיל משמש תבנית","רק פעולת ההליקאז","תיקון בעזרת RNA","חלוקת הגרעין"],c:0,e:"כל גדיל ישן משמש תבנית, ובסיסים נקשרים לפי כלל הזיווג (A-T, G-C)."},
{q:"מולקולת DNA עם 15N בשני גדיליה שוכפלה 3 פעמים בסביבה רגילה. כמה מולקולות מכילות גדיל ישן?",o:["1","2","4","8"],c:1,e:"שכפול שמרני למחצה: שני הגדילים הישנים לא נעלמים, ולכן תמיד 2 מולקולות מתוך 8 מכילות גדיל ישן."}],
cyc:[{q:"באיזה שלב של האינטרפאזה מתרחש שכפול ה-DNA?",o:["S","G1","G2","M"],c:0,e:"S = סינתזה של DNA. ב-G1 ו-G2 התא גדל ומתכונן."},
{q:"כמה כרומטידות יש בכל כרומוזום במטאפאזה של מיטוזה?",o:["1","2","4","אפס"],c:1,e:"אחרי שכפול כל כרומוזום מורכב משתי כרומטידות אחיות זהות."},
{q:"מה קורה באנאפאזה של מיטוזה?",o:["הכרומטידות נפרדות וכל אחת הופכת לכרומוזום","הומולוגים נפרדים","מתרחש קרוסינג־אובר","ה-DNA משתכפל"],c:0,e:"הכרומטידות האחיות נפרדות. הפרדת הומולוגים וקרוסינג־אובר שייכים למיוזה I."}],
mei:[{q:"באיזה שלב מתרחש קרוסינג־אובר?",o:["פרופאזה I","מטאפאזה II","אנאפאזה I","טלופאזה II"],c:0,e:"בפרופאזה I כרומוזומים הומולוגיים מתחברים ומחליפים קטעים."},
{q:"במה שונה אנאפאזה I מאנאפאזה II?",o:["ב-I נפרדים הומולוגים, ב-II נפרדות כרומטידות","ב-I נפרדות כרומטידות, ב-II הומולוגים","אין הבדל","ב-II ה-DNA משתכפל"],c:0,e:"מיוזה I מפרידה זוגות הומולוגיים (חלוקה מצמצמת). מיוזה II מפרידה כרומטידות, כמו במיטוזה."},
{q:"בתא גוף אנושי 2n=46. כמה כרומוזומים בגמטה?",o:["23","46","92","12"],c:0,e:"הגמטה הפלואידית (n) מכילה כרומוזום אחד מכל זוג הומולוגי: 23."}],
prot:[{q:"איזו חומצה אמינית מקודדת על ידי AUG, ומה תפקידו הנוסף?",o:["Met – קודון התחלה","Gly – קודון סיום","Lys – קודון התחלה","Met – קודון סיום"],c:0,e:"AUG מקודד למתיונין ומסמן את תחילת התרגום."},
{q:"בגדיל התבנית מופיע TAC. מהו הקודון ב-mRNA?",o:["AUG","UAC","ATG","TAC"],c:0,e:"mRNA משלים לתבנית (A עם U במקום T): TAC ← AUG."},
{q:"מוטציה שקטה היא:",o:["החלפת בסיס שאינה משנה את חומצת האמינו","החלפה שיוצרת קודון סיום","הוספת בסיס אחד בלבד","מחיקת גן שלם"],c:0,e:"הקוד הגנטי מנוון: כמה קודונים מקודדים לאותה חומצה אמינית."}],
tf:[{q:"מיטוזה מתרחשת בתאי גוף ויוצרת תאים זהים גנטית לתא האם.",o:["נכון","לא נכון"],c:0,e:"נכון (בהיעדר מוטציות)."},
{q:"tRNA נושא את הקודון המשלים לאנטי-קודון.",o:["נכון","לא נכון"],c:0,e:"נכון: האנטי-קודון ב-tRNA משלים לקודון ב-mRNA. הניסוח ההפוך הוא הטעות הנפוצה."},
{q:"בסוף מיוזה נוצרים שני תאים דיפלואידיים.",o:["נכון","לא נכון"],c:1,e:"נוצרים ארבעה תאים הפלואידיים."},
{q:"בשכפול DNA שני הגדילים משמשים תבנית.",o:["נכון","לא נכון"],c:0,e:"נכון, זהו שכפול שמרני למחצה."}],
graph:[{q:"בנקודה 6 יש ירידה ראשונה בכמות ה-DNA. מה גורם לה?",o:["חלוקת התא לשני תאים, כל אחד עם כרומוזום מכל זוג הומולוגי","הפרדת כרומטידות","פירוק ה-DNA","התנתקות הליקאז"],c:0,e:"בסוף מיוזה I נוצרים שני תאים, וכמות ה-DNA בכל תא יורדת בחצי."},
{q:"מדוע בנקודה 9 כמות ה-DNA היא 1 ולא 2?",o:["כל תא קיבל כרומטידה אחת מכל כרומוזום","ה-DNA התפרק","התא איבד גנים","מתרחש שכפול נוסף"],c:0,e:"בחלוקה שנייה נפרדות כרומטידות, ולכן כל גמטה הפלואידית עם כמות DNA מינימלית."}]};
function quizHTML(id,t){return '<section class="card"><h3>'+(t||"חידון קצר")+'</h3><div class="quiz" data-q="'+id+'"></div></section>'}
function mountQuiz(el){var id=el.dataset.q;el.innerHTML="";Q[id].forEach(function(it,qi){var key=id+qi,box=document.createElement("div");box.className="qq";
function draw(){var idx=sh(it.o.map(function(_,i){return i}));box.innerHTML="<p><b>"+(qi+1)+".</b> "+it.q+"</p>"+idx.map(function(i){return '<button class="opt" data-i="'+i+'">'+it.o[i]+"</button>"}).join("")+'<div class="fb" aria-live="polite"></div>';
$$(".opt",box).forEach(function(b){b.onclick=function(){var i=+b.dataset.i,ok=i===it.c;$$(".opt",box).forEach(function(x){x.disabled=true;if(+x.dataset.i===it.c&&ok)x.classList.add("right")});if(!ok)b.classList.add("wrong");
var fb=$(".fb",box);fb.className="fb "+(ok?"good":"bad");fb.innerHTML=(ok?"נכון! ":"לא מדויק. ")+it.e+(ok?"":' <button class="btn retry">נסו שוב</button>');
award(key);var r=$(".retry",fb);if(r)r.onclick=draw}})}
draw();el.appendChild(box)})}

/* ---------- איורים ---------- */
function lineGraph(vals,idx,ttl,ymax){ymax=ymax||4;var W=560,H=210,px=60,py=30,n=vals.length,bw=(W-px-20)/(n-1),by=H-40,sc=(by-py)/ymax,s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+ttl+'"><text x="'+(W/2)+'" y="18" text-anchor="middle">'+ttl+'</text>';
for(var y=0;y<=ymax;y++){s+='<line x1="'+px+'" x2="'+(W-10)+'" y1="'+(by-y*sc)+'" y2="'+(by-y*sc)+'" stroke="var(--line)"/><text x="'+(px-8)+'" y="'+(by-y*sc+4)+'" text-anchor="end">'+y+'c</text>'}
var pts=vals.map(function(v,i){return (px+i*bw)+","+(by-v*sc)}),st=[];vals.forEach(function(v,i){if(i)st.push((px+i*bw)+","+(by-vals[i-1]*sc));st.push(pts[i])});
s+='<polyline points="'+st.join(" ")+'" fill="none" stroke="var(--dna)" stroke-width="3"/>';
vals.forEach(function(v,i){s+='<circle cx="'+(px+i*bw)+'" cy="'+(by-v*sc)+'" r="'+(i===idx?8:4)+'" fill="'+(i===idx?"var(--chr)":"var(--dna)")+'"/><text x="'+(px+i*bw)+'" y="'+(by+20)+'" text-anchor="middle">'+(i+1)+'</text>'});
return s+'<text x="14" y="'+(H/2)+'" transform="rotate(-90 14 '+(H/2)+')" text-anchor="middle">כמות DNA יחסית בתא</text><text x="'+(W/2)+'" y="'+(H-4)+'" text-anchor="middle">שלבים לפי הסדר</text></svg>'}
function glyph(x,y,L,dbl,col){if(!dbl)return '<rect x="'+(x-3)+'" y="'+(y-L/2)+'" width="6" height="'+L+'" rx="3" fill="'+col+'"/>';
return '<rect x="'+(x-6)+'" y="'+(y-L/2)+'" width="5" height="'+L+'" rx="2.5" fill="'+col+'"/><rect x="'+(x+1)+'" y="'+(y-L/2)+'" width="5" height="'+L+'" rx="2.5" fill="'+col+'"/><circle cx="'+x+'" cy="'+y+'" r="2.5" fill="var(--card)"/>'}
var FREE=[[-.45,-.3],[.35,-.4],[-.25,.4],[.45,.25],[0,0],[-.55,.05],[.1,-.6],[.1,.6]];
function cellSvg(sp){var k=sp.k,r=k===1?105:k===2?90:62,cx=k===1?[300]:k===2?[170,430]:[90,230,370,510],s='<svg viewBox="0 0 600 230" role="img" aria-label="'+sp.n+'">';
cx.forEach(function(X){s+='<circle cx="'+X+'" cy="115" r="'+r+'" class="cellc"/>';if(sp.l==="line"||sp.l==="pair"||sp.l==="split")s+='<line x1="'+(X-r+6)+'" x2="'+(X+r-6)+'" y1="115" y2="115" stroke="var(--mut)" stroke-dasharray="3 5"/>';
for(var i=0;i<sp.p;i++){var dx,dy,h=sp.p/2;
if(sp.l==="free"){dx=FREE[i%8][0]*r*.8;dy=FREE[i%8][1]*r*.8}
else if(sp.l==="line"){dx=(i-(sp.p-1)/2)*r*.42;dy=0}
else if(sp.l==="pair"){dx=(Math.floor(i/2)-.5)*r*.6+(i%2?8:-8);dy=0}
else{var g=i<h?-1:1,j=i%h;dx=(j-(h-1)/2)*r*.42;dy=g*r*.5}
var ls=sp.ls||[26,26,17,17];s+=glyph(X+dx,115+dy,ls[i%ls.length],sp.d,i%2?"var(--chr2)":"var(--chr)")}});return s+"</svg>"}

var MIT=[{n:"G1",k:1,p:4,d:0,l:"free",dna:2,c:4,t:"G1: התא גדל ועושה את תפקידו. בכל כרומוזום מולקולת DNA אחת."},
{n:"S ו-G2",k:1,p:4,d:1,l:"free",dna:4,c:4,t:"אחרי שלב S ה-DNA שוכפל: כל כרומוזום מורכב משתי כרומטידות אחיות. מספר הכרומוזומים לא השתנה."},
{n:"פרופאזה",k:1,p:4,d:1,l:"free",dna:4,c:4,t:"הכרומוזומים מתעבים, הקרום הגרעיני נעלם, וסיבי הציר נוצרים."},
{n:"מטאפאזה",k:1,p:4,d:1,l:"line",dna:4,c:4,t:"הכרומוזומים מסתדרים במישור המשווני, וכל כרומטידה מחוברת לסיבי ציר מצד אחר."},

{t:"פתיחה",r:function(){return "<h2>איך מידע תורשתי הופך לתכונה?</h2><p>החומר התורשתי הוא DNA. הוא מאורגן בכרומוזומים, ומתוכו נקראים גנים שמקודדים לחלבונים. הצבעים כאן קבועים לאורך הפעילות.</p><div class='grid'>"+term("dna","DNA","מולקולת המידע, בגרעין")+term("rna","RNA","מתווך: mRNA, tRNA, rRNA")+term("pro","חלבון","התוצר שקובע תכונה")+term("chr","כרומוזום וכרומטידה","אריזת ה-DNA וחלוקתו")+"</div><section class='card'><h3>הדמיה: מ-DNA לחלבון</h3><div id='ost'></div><div class='row'><button class='btn alt' id='op'>הקודם</button><button class='btn alt' id='on'>הבא</button></div></section>"+quizHTML("open")},m:mountOpen},
{t:"סקירה",r:function(){return "<h2>סקירה: שני סוגי חלוקה</h2><p>בחרו תהליך וראו איך כמות ה-DNA בתא משתנה (c = כמות DNA בסיסית).</p><div class='row'><button class='btn' id='gm'>מיטוזה</button><button class='btn alt' id='gi'>מיוזה</button></div><div id='ovg'></div><section class='card'><table><tr><th></th><th>מיטוזה</th><th>מיוזה</th></tr><tr><th>מספר חלוקות</th><td>1</td><td>2</td></tr><tr><th>תאים שנוצרים</th><td>2</td><td>4</td></tr><tr><th>סוג התאים</th><td>דיפלואידיים, זהים</td><td>הפלואידיים, שונים</td></tr><tr><th>תפקיד</th><td>גדילה ותיקון</td><td>יצירת גמטות</td></tr></table></section>"},
 m:function(){function g(a){$("#ovg").innerHTML=lineGraph(a?[2,4,4,4,4,2,2,2,1]:[2,4,4,4,4,2],-1,a?"מיוזה":"מיטוזה");$("#gm").className="btn"+(a?" alt":"");$("#gi").className="btn"+(a?"":" alt")}$("#gm").onclick=function(){g(0)};$("#gi").onclick=function(){g(1)};g(0)}},
{t:"חומר תורשתי",r:function(){return "<h2>חומר תורשתי: מבנה ושכפול</h2><p>ה-DNA הוא סליל כפול. הגדילים משלימים: A-T בשני קשרי מימן, G-C בשלושה. כתבו רצף וראו את הזיווג.</p><section class='card'><div class='row'><input type='text' id='seq' value='ATGCCGTA' dir='ltr' maxlength='14' aria-label='רצף'><button class='btn alt' id='rnd'>רצף אקראי</button></div><div id='pst'></div><p id='pinfo'></p></section><section class='card'><h3>שכפול (שמרני למחצה)</h3><div class='row'><span>התקדמות:</span><input type='range' id='rep' min='0' max='100' value='45' aria-label='התקדמות השכפול'></div><div id='rst'></div><p id='rtx'></p></section><section class='card'><h3>מספר שכפולים</h3><div class='row'><input type='range' id='gen' min='0' max='5' value='3' aria-label='מספר שכפולים'></div><div id='gst'></div></section>"+quizHTML("gen")},m:mountGen},
{t:"מחזור התא ומיטוזה",r:function(){return "<h2>מחזור התא ומיטוזה</h2><p>האינטרפאזה (G1, S, G2) מכינה את התא; אחריה חלוקה. הזיזו את הסרגל בין השלבים.</p><section class='card'>"+simBlock("mi",MIT,"שלב במיטוזה")+"</section>"+quizHTML("cyc")},m:function(){mountCycle("mi",MIT,[2,4,4,4,4,2],4)}},
{t:"מיוזה",r:function(){return "<h2>מיוזה: חלוקה מצמצמת</h2><p>תא דיפלואידי (2n=4) יוצר ארבע גמטות הפלואידיות. שימו לב לאנאפאזה I לעומת אנאפאזה II.</p><section class='card'>"+simBlock("me",MEI,"שלב במיוזה")+"</section>"+quizHTML("mei")},m:function(){mountCycle("me",MEI,[2,4,4,4,4,2,2,2,1],4)}},
{t:"מ-DNA לחלבון",r:function(){return "<h2>מ-DNA לחלבון</h2><div class='grid'>"+term("rna","mRNA","נושא את הקודונים מהגרעין לריבוזום")+term("rna","tRNA","נושא חומצה אמינית ואנטי-קודון")+term("rna","rRNA","מרכיב את הריבוזום")+"</div><section class='card'><h3>קוראים את הגן</h3><p>גדיל התבנית (כחול), ה-mRNA (כתום), הקודונים והחלבון (ירוק). התרגום מתחיל ב-AUG.</p><div class='row'><span>ריבוזום:</span><input type='range' id='rib' min='0' max='5' value='0' aria-label='התקדמות הריבוזום'></div><div id='pout'></div><p id='pnote'></p><div class='row'><button class='btn alt' id='mutb'>הכניסו מוטציה אקראית</button><button class='btn alt' id='undo'>חזרה למקור</button></div><p id='mut'></p></section>"+quizHTML("prot")},m:mountProt},
{t:"תרגול",r:function(){return "<h2>תרגול</h2><section class='card'><h3>התאמת מושגים להגדרות</h3><div id='match'></div><div class='row'><button class='btn' id='mchk'>בדיקה</button></div></section><section class='card'><h3>מיון טענות</h3><div id='cls'></div></section><section class='card'><h3>סדרו את שלבי המיטוזה</h3><div id='ordp'></div><p id='ordo'></p><div id='ordf' class='fb'></div><button class='btn alt' id='ordx'>התחלה מחדש</button></section><section class='card'><h3>קריאת גרף</h3><div id='gg'></div></section>"+quizHTML("graph","שאלות על הגרף")+quizHTML("tf","נכון או לא נכון")},m:mountPractice},
{t:"שאלות בגרות",r:function(){return "<h2>שאלות בסגנון בגרות</h2><p>כתבו תשובה, הציגו תשובה לדוגמה והעריכו את עצמכם.</p>"+bagrut()},m:mountBagrut}];

function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));S.seen[S.step]=1;save();render();window.scrollTo(0,0)}
function render(){var s=STEPS[S.step];$("#main").innerHTML=s.r()+'<div class="foot"><button class="btn alt" id="pv"'+(S.step===0?" disabled":"")+'>הקודם</button><button class="btn" id="nx"'+(S.step===STEPS.length-1?" disabled":"")+'>הבא</button></div>';
if(s.m)s.m();$$(".quiz").forEach(mountQuiz);$("#pv").onclick=function(){go(S.step-1)};$("#nx").onclick=function(){go(S.step+1)};
$("#nav").innerHTML=STEPS.map(function(t,i){return '<button class="st'+(i===S.step?" on":"")+(S.seen[i]?" seen":"")+'" data-i="'+i+'">'+(i+1)+". "+t.t+"</button>"}).join("");$$(".st").forEach(function(b){b.onclick=function(){go(+b.dataset.i)}});
$("#prog").style.width=Math.round(Object.keys(S.seen).length/STEPS.length*100)+"%";upd()}
function theme(d){document.documentElement.setAttribute("data-theme",d?"dark":"light")}
var dm=S.dark;if(dm===undefined)dm=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;theme(dm);
$("#dark").onclick=function(){dm=!dm;S.dark=dm;save();theme(dm)};
$("#reset").onclick=function(){if(confirm("לאפס את הניקוד וההתקדמות?")){S={step:0,ok:{},att:{},seen:{},dark:dm};save();go(0)}};
S.seen[S.step]=1;render();
})();
</script>
